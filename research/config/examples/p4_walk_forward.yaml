# P4 validity — walk-forward, OOS-ranked Donchian channel sweep (design §7).
#
#   make research RUN=research/config/examples/p4_walk_forward.yaml
#   → research/runs/<UTC-ts>/report.html  (combos ranked on OUT-OF-SAMPLE Sharpe,
#     IS→OOS degradation per combo, a multiple-testing reality-check, and the top
#     candidate vs buy-and-hold)
#
# Runs on the FAST numpy screen (engine: daily) — NON-authoritative. The point is
# anti-overfitting discipline: rank on data the params were NOT tuned on, and show
# how much the edge decays out-of-sample + whether it survives the multiple-testing
# haircut. CONFIRM the winning combo in LEAN (engine: lean) before trusting it.
#
# ⚠ Data depth: a meaningful walk-forward wants MULTI-YEAR history with several
# non-overlapping OOS folds across regimes. The current on-disk snapshot is ~1yr
# for ETFs (and single-expiry for futures), so these windows are deliberately small
# to fit — a demonstrator, not a verdict. Deep multi-regime history (full-size
# PARENTS: ES/NQ/RTY/YM/GC + micros for the recent period) is the next data step.
name: p4_donchian_channel_sweep
engine: daily
mode: backtest
resolution: daily
universe: ["TLT"]
date_range: { start: 2025-06-05, end: 2026-06-03 }
starting_cash: 100000
strategy:
  ref: donchian
  contracts: 1
  sweep: { channel: [10, 20, 30, 40] }   # the parameter grid (4 combos)
validity: { scheme: walk_forward, is_months: 6, oos_months: 2, step_months: 2 }
benchmarks: ["buy_and_hold"]
