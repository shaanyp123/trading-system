name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ruff
        run: pip install 'ruff>=0.7.4'
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  dep-drift-check:
    name: dep drift (Dockerfile vs pyproject)
    # Closes the loop on the Day 11 carryover root cause (PR #47): PR #44
    # added httpx + resend to pyproject.toml runtime deps but did NOT
    # update the api Dockerfile's hardcoded pip-install list. The
    # Dockerfile builder's import sanity check did NOT catch it because
    # services.api.main doesn't transitively import services.webhook_pusher
    # today; the ImportError only surfaced when the operator runbook smoke
    # ran from inside the api container. This job fails CI on any future
    # drift between the two lists at the SAME PR that introduces it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diff pyproject runtime deps vs Dockerfile pip-install list
        run: python3 scripts/check_dockerfile_deps_against_pyproject.py

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        # `--no-git` scans the current filesystem state, which is what we want as a
        # PR gate ("does this change introduce a secret?"). Git-history scans trip
        # on documentation false positives at old paths and don't add value beyond
        # what working-tree scanning already catches for new commits.
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml --verbose

  # ---------------------------------------------------------------------------
  # typecheck + test were enabled 2026-05-05 once the first real code (v1
  # strategy skeleton, PR #4) landed. docker-build stays commented until
  # any service has a Dockerfile (Phase 0 Week 5+).
  # ---------------------------------------------------------------------------

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: mypy services infrastructure strategies scripts

  test:
    name: test (pytest --cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Coverage floor is set in pyproject.toml [tool.coverage.report]
      # fail_under (currently 70). Per dev-guide §3.1 it tightens to 90 for
      # services/audit, services/risk, services/execution once those land.
      - run: pytest --cov --cov-report=xml

  # Frontend gate. Day 20 (PR #66) shipped apps/web/ but did NOT add it to
  # CI. This job closes the gap so a future Python-only diff that breaks
  # the Next.js build (e.g., touching shared types under packages/api-types
  # in Phase 1+) is caught at PR time, not at `make ci` time locally.
  # Mirrors the `make frontend-test` target in the repo-root Makefile.
  frontend-test:
    name: frontend-test (pnpm typecheck + lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: pnpm lint
        working-directory: apps/web
        run: pnpm lint
      - name: pnpm build
        working-directory: apps/web
        run: pnpm build

  # docker-build matrix: one job per service that ships a Dockerfile. New
  # services join by appending an entry to `matrix.include` (NOT the legacy
  # short-form `matrix.service: [...]` — moved to include-style Day 20 so
  # apps/web/ can specify its own dockerfile path + build context without
  # forcing repo-root context like the api + webhook_pusher containers).
  # Day 5 onboards `api`; Day 10 PR #50 onboards `webhook_pusher`; Day 20
  # PR #66 ships `apps/web/Dockerfile` and the Day-20-follow-up CI hygiene
  # PR onboards it here.
  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: services/api/Dockerfile
            context: .
          - service: webhook_pusher
            dockerfile: services/webhook_pusher/Dockerfile
            context: .
          - service: web
            dockerfile: apps/web/Dockerfile
            context: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        run: |
          docker buildx build \
            --file ${{ matrix.dockerfile }} \
            --tag local/trading-${{ matrix.service }}:${{ github.sha }} \
            --load \
            ${{ matrix.context }}
