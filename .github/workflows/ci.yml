name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ruff
        run: pip install 'ruff>=0.7.4'
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        # `--no-git` scans the current filesystem state, which is what we want as a
        # PR gate ("does this change introduce a secret?"). Git-history scans trip
        # on documentation false positives at old paths and don't add value beyond
        # what working-tree scanning already catches for new commits.
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml --verbose

  # ---------------------------------------------------------------------------
  # Jobs below are commented out in the initial scaffold. Each is re-enabled
  # in the PR that introduces the first code requiring it. This way CI stays
  # green during scaffold and tightens as services land.
  # ---------------------------------------------------------------------------

