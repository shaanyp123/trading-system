name: ci

# ============================================================================
# CI workflow — reworked 2026-05-12 for cost efficiency.
#
# Design:
# - `precheck` computes `[skip ci]` marker + per-area path filters.
# - Always-on (cheap; ~30s combined): lint, dep-drift-check, gitleaks.
# - Conditional (gated on relevant paths): typecheck, test, frontend-test,
#   docker-build-* (one job per service).
# - `ci-gate` is the ONLY job that branch protection should require.
#   It depends on all conditional jobs via `needs:` and uses `if: always()`
#   so jobs that correctly skip-because-not-applicable count as passing.
#
# See .github/workflows/README.md for full rationale, the `[skip ci]`
# marker semantics, and how to add a new conditional job.
# ============================================================================

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read  # dorny/paths-filter reads PR file list via the API
  # docker-publish-api (main-only) needs packages:write to push the api
  # image to ghcr.io. Set at the workflow level rather than per-job so the
  # ci-gate aggregator can also `needs:` it without scope surprises.
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # precheck: compute skip-ci marker + which areas of the repo changed.
  # Downstream jobs gate on these outputs via their `if:` conditions.
  # ---------------------------------------------------------------------------
  precheck:
    name: precheck (skip-ci + path filters)
    runs-on: ubuntu-latest
    outputs:
      skip_all: ${{ steps.skip_check.outputs.skip_all }}
      python_backend: ${{ steps.changes.outputs.python_backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      api: ${{ steps.changes.outputs.api }}
      discord_bot: ${{ steps.changes.outputs.discord_bot }}
      webhook_pusher: ${{ steps.changes.outputs.webhook_pusher }}
      workflow_self: ${{ steps.changes.outputs.workflow_self }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # paths-filter falls back to git diff on push events

      - name: Detect [skip ci] / [ci skip] markers
        id: skip_check
        env:
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Reserve [skip ci] for genuine emergencies — path filters already
          # cover the docs-only case automatically.
          MARKER_RE='\[skip ci\]|\[ci skip\]|\[no ci\]|\[skip actions\]'

          SKIP=false
          if [ -n "${HEAD_COMMIT_MSG:-}" ] && echo "$HEAD_COMMIT_MSG" | grep -qE "$MARKER_RE"; then
            echo "::notice title=Skip-CI marker detected::Found in commit message; expensive jobs will skip."
            SKIP=true
          elif [ -n "${PR_TITLE:-}" ] && echo "$PR_TITLE" | grep -qE "$MARKER_RE"; then
            echo "::notice title=Skip-CI marker detected::Found in PR title; expensive jobs will skip."
            SKIP=true
          fi

          echo "skip_all=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Compute changed paths
        id: changes
        # Pinned to v3 major; supply-chain risk is acceptable per dev-guide §11
        # action-pinning policy (major-version pin OK; floating-tag is not).
        uses: dorny/paths-filter@v3
        with:
          filters: |
            workflow_self:
              - '.github/workflows/ci.yml'
              - 'scripts/check_dockerfile_deps_against_pyproject.py'
            python_backend:
              - 'services/**'
              - 'strategies/**'
              - 'research/**'
              - 'infrastructure/**'
              - 'tests/**'
              - 'scripts/**'
              - 'alembic/**'
              - 'pyproject.toml'
              - 'Makefile'
              - 'conftest.py'
            frontend:
              - 'apps/web/**'
              - 'packages/**'
            # The api image (services/api/Dockerfile) is built from the repo
            # ROOT and COPYs the FULL backend source surface into the image —
            # NOT just services/api/**. This filter MUST track that surface
            # (the Dockerfile's COPY layers) or main-push publishes silently
            # skip when bundled-but-non-api code changes, leaving
            # ghcr.io/<owner>/trading-api:latest STALE. Root-caused 2026-06-08:
            # PRs #326/#327/#328 touched services/data, services/execution, and
            # scripts/operator_tools — all bundled into the image, none under
            # services/api/** — so docker-publish-api skipped on those main
            # pushes and the paper host had to fall back to a local build.
            # Keep this list in lockstep with services/api/Dockerfile's COPYs.
            # (research/, tests/, Makefile, conftest.py are intentionally
            #  EXCLUDED — they are not COPYed into the image.)
            api:
              - 'services/**'
              - 'infrastructure/**'
              - 'strategies/**'
              - 'alembic/**'
              - 'alembic.ini'
              - 'scripts/**'
              - 'pyproject.toml'
            discord_bot:
              - 'services/discord_bot/**'
              - 'pyproject.toml'
            webhook_pusher:
              - 'services/webhook_pusher/**'
              - 'pyproject.toml'

  # ---------------------------------------------------------------------------
  # Always-on jobs (cheap; ~30s combined).
  # ---------------------------------------------------------------------------

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.skip_all != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install ruff
        # Pinned to match pyproject.toml dev deps. Keep these two in sync —
        # local/CI version drift previously caused unnecessary CI cycles
        # (PR #211 was reformatted by a newer ruff in CI than locally).
        run: pip install 'ruff==0.15.14'
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check
        run: ruff check .

  dep-drift-check:
    name: dep drift (Dockerfile vs pyproject)
    # Closes the loop on the Day 11 carryover root cause (PR #47): PR #44
    # added httpx + resend to pyproject.toml runtime deps but did NOT
    # update the api Dockerfile's hardcoded pip-install list. The
    # Dockerfile builder's import sanity check did NOT catch it because
    # services.api.main doesn't transitively import services.webhook_pusher
    # today; the ImportError only surfaced when the operator runbook smoke
    # ran from inside the api container. This job fails CI on any future
    # drift between the two lists at the SAME PR that introduces it.
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.skip_all != 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diff pyproject runtime deps vs Dockerfile pip-install list
        run: python3 scripts/check_dockerfile_deps_against_pyproject.py

  gitleaks:
    name: gitleaks (secret scan)
    # Universal security gate — intentionally NOT gated on skip_all. Per
    # dev-guide §11, secret-scanning is uniform across every commit; the
    # cost (~10s) is negligible. Emergency override requires explicit
    # branch-protection admin bypass, not a commit-message marker.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan working tree for secrets
        # `--no-git` scans the current filesystem state, which is what we want as a
        # PR gate ("does this change introduce a secret?"). Git-history scans trip
        # on documentation false positives at old paths and don't add value beyond
        # what working-tree scanning already catches for new commits.
        run: gitleaks detect --source . --no-git --redact --config .gitleaks.toml --verbose

  # ---------------------------------------------------------------------------
  # Conditional Python jobs.
  # ---------------------------------------------------------------------------

  typecheck:
    name: typecheck (mypy --strict)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.python_backend == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      - run: mypy services infrastructure strategies scripts research

  test:
    name: test (pytest --cov)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.python_backend == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -e ".[dev]"
      # Coverage floor is set in pyproject.toml [tool.coverage.report]
      # fail_under (currently 70). Per dev-guide §3.1 it tightens to 90 for
      # services/audit, services/risk, services/execution once those land.
      - run: pytest --cov --cov-report=xml

  # ---------------------------------------------------------------------------
  # Frontend gate. Day 20 (PR #66) shipped apps/web/ but did NOT add it to
  # CI. The Day 20 follow-up (PR #67) closed the gap. This rework gates the
  # job to fire only when apps/web/** or packages/** changes (or when the
  # workflow itself is modified — workflow_self).
  # ---------------------------------------------------------------------------

  frontend-test:
    name: frontend-test (pnpm typecheck + lint + build)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.frontend == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: pnpm install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: pnpm typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: pnpm lint
        working-directory: apps/web
        run: pnpm lint
      - name: pnpm build
        working-directory: apps/web
        run: pnpm build

  # ---------------------------------------------------------------------------
  # docker-build: one job per service. Splitting the Day-20 matrix into
  # separate jobs lets each service's build gate independently on its own
  # path filter — backend-only PRs skip the web docker build, frontend-only
  # PRs skip all four service builds, etc. New services join by copying one
  # of these jobs + adding a matching filter to `precheck.changes` + adding
  # to `ci-gate.needs` below.
  #
  # docker/build-push-action@v5 wires GHA buildx cache (type=gha) so warm
  # rebuilds reuse layers between PR runs; cuts re-build time when only a
  # late layer (e.g., app code, not base image deps) changes.
  # ---------------------------------------------------------------------------

  docker-build-api:
    name: docker build (api)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.api == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          file: services/api/Dockerfile
          context: .
          tags: local/trading-api:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  # ---------------------------------------------------------------------------
  # docker-publish-api: push the api image to ghcr.io on main pushes ONLY.
  # PRs run docker-build-api above (build + cache, no push); merges to main
  # re-run the same build with push=true so the operator can `docker compose
  # pull api` on the VPS instead of always re-building locally.
  #
  # Scoped to api only (the only service in the current Phase 1 deploy);
  # discord_bot / web / webhook_pusher stay build-only until
  # they're actively deployed.
  #
  # The job re-runs docker/build-push-action against the same GHA buildx
  # cache scope (`api`) so the publish path costs ~10-15s (cache-hot) rather
  # than a full re-build.
  #
  # Tag conventions:
  #   * ghcr.io/<owner>/trading-api:<sha>    — immutable per-commit
  #   * ghcr.io/<owner>/trading-api:latest   — moves with main HEAD
  #
  # The deploy ceremony's `deploy/day5-bringup.sh` already checks
  # `docker image inspect ghcr.io/${GHCR_OWNER}/trading-api:<tag>` and
  # falls back to local build when the image isn't cached, so this PR is
  # additive — pre-existing local-build deploys still work.
  # ---------------------------------------------------------------------------

  docker-publish-api:
    name: docker publish api (main only)
    runs-on: ubuntu-latest
    needs: [precheck, docker-build-api]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.api == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push image
        uses: docker/build-push-action@v5
        with:
          file: services/api/Dockerfile
          context: .
          tags: |
            ghcr.io/${{ github.repository_owner }}/trading-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/trading-api:latest
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  docker-build-discord_bot:
    name: docker build (discord_bot)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.discord_bot == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          file: services/discord_bot/Dockerfile
          context: .
          tags: local/trading-discord_bot:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=discord_bot
          cache-to: type=gha,mode=max,scope=discord_bot

  docker-build-web:
    name: docker build (web)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.frontend == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          file: apps/web/Dockerfile
          context: apps/web
          tags: local/trading-web:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  docker-build-webhook_pusher:
    name: docker build (webhook_pusher)
    runs-on: ubuntu-latest
    needs: precheck
    if: >-
      needs.precheck.outputs.skip_all != 'true' &&
      (needs.precheck.outputs.webhook_pusher == 'true' ||
       needs.precheck.outputs.workflow_self == 'true')
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          file: services/webhook_pusher/Dockerfile
          context: .
          tags: local/trading-webhook_pusher:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha,scope=webhook_pusher
          cache-to: type=gha,mode=max,scope=webhook_pusher

  # ---------------------------------------------------------------------------
  # ci-gate: the ONE job branch protection should require.
  #
  # `if: always()` so this runs even when upstream jobs skip. The verification
  # step inspects each upstream's `result` and fails iff any are `failure` or
  # `cancelled`. `skipped` (because a path filter excluded the job) counts as
  # passing for branch-protection purposes — the whole point of the path-
  # filter optimization.
  #
  # IMPORTANT: when adding a new conditional job to this workflow, also add
  # it to this `needs:` list. Forgetting that means the job's failure will
  # NOT block merge — silent supply-chain risk.
  # ---------------------------------------------------------------------------

  ci-gate:
    name: ci-gate (required status check)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - precheck
      - lint
      - dep-drift-check
      - gitleaks
      - typecheck
      - test
      - frontend-test
      - docker-build-api
      - docker-publish-api  # main-only; skipped on PRs (skip == pass for ci-gate)
      - docker-build-discord_bot
      - docker-build-web
      - docker-build-webhook_pusher
    steps:
      - name: Verify no required job failed
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "Upstream job results:"
          echo "$NEEDS_CONTEXT" | jq .

          # `success` and `skipped` both count as passing. `failure` and
          # `cancelled` block the gate.
          FAILED=$(echo "$NEEDS_CONTEXT" | jq -r '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | .[].key
          ')

          if [ -n "$FAILED" ]; then
            echo ""
            echo "::error title=CI gate failed::These required jobs did not pass:"
            echo "$FAILED" | sed 's/^/  - /'
            exit 1
          fi

          echo ""
          echo "✓ All required jobs passed or were skipped-because-not-applicable."
