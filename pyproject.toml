[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trading-system"
version = "0.1.0"
description = "Solo-operator algorithmic trading system (Phase 0 scaffold)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary" }
authors = [{ name = "shaanyp123" }]

# Runtime dependencies shared across services. Per-service Dockerfiles install
# only what each container needs at build time.
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "structlog>=24.4",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "webauthn>=2.0",
  "uuid-utils>=0.10",
  # numpy: services/risk/sizing.py uses np.linalg.eigh for the Higham PSD repair
  # algorithm (backend-spec §2.4.1 Stage 3). Eigendecomposition in pure Python
  # would be slow + numerically fragile; numpy is the canonical choice.
  "numpy>=2.1",
  "discord.py>=2.4",
  "httpx>=0.28",
  "apscheduler>=3.11",
  "resend>=2.4",
  "anthropic>=0.39",
  "pyyaml>=6.0",
  # ib-async (Pivot-PR-B; post-pivot 2026-05-12): maintained fork of
  # ib_insync. Async TWS API client wrapped by
  # services/execution/ibkr_adapter.py to place + cancel + monitor IBKR
  # orders. Talks to the ib_gateway Docker container on port 4002 (paper)
  # / 4001 (live) using IBKR's TWS API protocol (NOT REST; binary framing).
  # RETIRING: dies with the §3.1 coinbase adapter PR (crypto-pivot C0-B2b).
  "ib-async>=1.0.3",
  # websockets (crypto-pivot C0-B2a): async client for the public Coinbase
  # Advanced Trade WS ticker channel (services/data/coinbase_market_data.py
  # — marks for the 30s risk loop, delta spec §3.2). Fully typed (py.typed);
  # REST stays on httpx. Upper bound <14: coinbase-advanced-py (the §3.1
  # execution adapter SDK, C0-B2b) pins websockets>=12,<14 — a >=14 pin
  # here would make the two unresolvable in one environment.
  "websockets>=12.0,<14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.6",
  "mypy>=1.13",
  "ruff==0.15.14",
  "testcontainers[postgres]>=4.8",
  # Sync Postgres driver — required by Alembic (sync) and the testcontainers
  # `PostgresContainer.get_connection_url()` default (psycopg2). Runtime
  # services use asyncpg per dev-guide §7.2; this is migrations / tests only.
  "psycopg2-binary>=2.9",
  "respx>=0.21",
  "freezegun>=1.5",
  "types-pyyaml>=6.0",
  "asgi-lifespan>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = [
  "services",
  "infrastructure",
  "strategies",
]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  ".venv",
  "Archive",
  "Prompts",
  "apps",          # JS/TS
  "packages",      # JS/TS
  # NOTE: "lean" also matches research/lean/** by ruff's gitignore-style
  # semantics; kept post-C0 (top-level lean/ deleted 2026-07-08) so the
  # research LEAN harness keeps its historical lint scope.
  "lean",
  "research/lean/projects",  # QC LEAN algorithms (AlgorithmImports *)
]

[tool.ruff.lint]
# Conservative starter set; widen as code lands.
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # bugbear
  "UP",     # pyupgrade
  "ASYNC",  # async-specific lints
  "S",      # bandit security
  "RUF",    # ruff-specific
]
ignore = [
  "S101",  # asserts ok in tests
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "B"]
"scripts/**/*.py" = ["S"]
# FastAPI uses `Depends()` in default args by design; B008 conflicts.
"services/api/routes/*.py" = ["B008"]
# Container entrypoint binds 0.0.0.0 by design and exec()s a known argv.
"services/api/entrypoint.py" = ["S104", "S603", "S606"]
# Discord bot entrypoint also exec()s a known argv — same pattern.
"services/discord_bot/entrypoint.py" = ["S603", "S606"]
# research/lean drives LEAN via subprocess (lean CLI / docker run). argv is built
# from known constants + validated paths (full exe resolved via shutil.which);
# never shell=True. Same exemption as the service entrypoints above.
"research/lean/images.py" = ["S603", "S607"]
"research/lean/driver.py" = ["S603", "S607"]
# Discord bot commands use `@app_commands.describe` decorator + nested
# closures; B008 (Depends-style) doesn't apply but the decorator pattern
# trips Ruff's "function call in argument default" check on the
# `@tree.command(...)` decorator stack — same exception we make for FastAPI.
"services/discord_bot/commands/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy ----------
# `--strict` is the contract per dev-guide §3.1. Empty repo passes; tightens automatically as code lands.
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
warn_return_any = true
exclude = [
  "Archive/",
  "Prompts/",
  "apps/",
  "packages/",
  "lean/",
  "research/lean/projects/",  # QC LEAN algorithms (AlgorithmImports * — like lean/)
  "alembic/versions/",   # generated migration files
]

# ib_async has no published type stubs as of v1.0.3. The adapter at
# services/execution/ibkr_adapter.py imports from this library at runtime
# (and via TYPE_CHECKING for static analysis) — let mypy treat it as Any
# rather than failing. Once typeshed (or the upstream lib) adds stubs,
# remove this override.
[[tool.mypy.overrides]]
module = "ib_async"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "ib_async.*"
ignore_missing_imports = true

# pandas is used only by the standalone crypto-perps research backtester
# (research/crypto_perps/**); it is not a project dependency and CI does not
# install it (nor pandas-stubs) — treat it as Any there.
[[tool.mypy.overrides]]
module = "pandas"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "unit: fast in-process tests (default)",
  "integration: spins up testcontainers (postgres etc.)",
  "golden: byte-exact parity tests",
  "e2e: full-stack browser tests (Playwright)",
]

# ---------- coverage ----------
# Per dev-guide §3.1: 90% on audit/risk/execution; 70% elsewhere.
# Enforced via `make test` once first service code lands; CI gate added in same PR.
[tool.coverage.run]
branch = true
source = ["services", "infrastructure", "strategies"]
omit = ["**/__init__.py", "**/main.py"]

[tool.coverage.report]
fail_under = 70
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
