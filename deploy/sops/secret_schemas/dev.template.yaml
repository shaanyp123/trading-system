# dev.template.yaml — local laptop dev environment.
#
# Copy to `secrets/dev.enc.yaml`, fill values, and encrypt with sops on Day 3
# 09:00. Source of truth for the schema is backend-spec.md §8.1.1; this file
# tracks that schema for the dev env where most fields are mocked or null.
#
# `dev` is intentionally minimal — local dev does NOT hit IBKR, QC live, S3,
# Resend, or Anthropic. Mocks and stubs cover everything except the auth
# stack (which we do exercise locally for WebAuthn ceremony testing).

postgres:
  app_service_password: MOCK_dev_app_password
  app_owner_password: MOCK_dev_owner_password

ibkr: null              # not used in dev


anthropic: null         # not used in dev

discord:
  bot_token: MOCK_dev_bot_token
  guild_id: MOCK_dev_guild_id
  api_bearer_token: MOCK_dev_discord_api_bearer       # Day 23
  webhook_urls:
    daily_brief: MOCK_dev_webhook_daily_brief
    signals: MOCK_dev_webhook_signals
    fills: MOCK_dev_webhook_fills
    alerts: MOCK_dev_webhook_alerts
    critical: MOCK_dev_webhook_critical
    ops: MOCK_dev_webhook_ops
    audit: MOCK_dev_webhook_audit
    # ask_agent: lands in Phase 2 per frontend-spec §1481


forex_factory: null
trading_economics: null
fred: null

s3: null                # backups not enabled in dev

github:
  app_id: <TODO_FROM_DAY_2_GITHUB_APP_RUNBOOK>            # safe to commit (not secret)
  installation_id: <TODO_FROM_DAY_2_GITHUB_APP_RUNBOOK>   # safe to commit (not secret)
  app_private_key: <TODO_FROM_DAY_2_GITHUB_APP_RUNBOOK>   # the .pem contents

internal:
  watchdog_bearer_token: MOCK_dev_watchdog_token
  ipc_bearer_token: MOCK_dev_ipc_token

webauthn:
  rp_id: localhost                  # dev uses localhost; paper/live use the apex domain
  origin: http://localhost:3000

resend: null            # email backup not exercised in dev
