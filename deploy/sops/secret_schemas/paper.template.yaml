# paper.template.yaml — Hetzner Ashburn paper environment (Phase 0).
#
# Copy to `secrets/paper.enc.yaml`, fill values, and encrypt with sops on
# Day 3 09:00. This is the environment that runs the QC paper algorithm
# 24/7 starting Week 1, talks to real Discord + real Resend, and is the
# QC ObjectStore push target throughout Phase 0–1.
#
# Values flagged `<TODO_FROM_DAY_X>` land at the indicated checkpoint; until
# then leave as-is and sops will still encrypt the placeholder string (which
# the runtime will reject loudly — fail-closed).

postgres:
  # Generated Day 3 via `openssl rand -hex 32` on the paper VPS;
  # captured into both Postgres pg_authid AND this file at the same time.
  app_service_password: <TODO_FROM_DAY_3_POSTGRES_BOOTSTRAP>
  app_owner_password: <TODO_FROM_DAY_3_POSTGRES_BOOTSTRAP>

# Crypto-pivot C0-B2b (2026-07-09): the IBKR TWS credential set
# (account_number, paper/live usernames+passwords, paper_account,
# client_id) was RETIRED with the IBKR execution layer — operator
# ceremony: `sops secrets/paper.enc.yaml` and delete those keys.
# Only the FlexQuery pair survives, feeding the EOD recon cycle until
# the §3.5 Coinbase recon fetcher replaces it.
ibkr:
  flex_query_token: <TODO_FROM_WEEK_2_IBKR_FLEX_SETUP>
  flex_query_id: <TODO_FROM_WEEK_2_IBKR_FLEX_SETUP>   # numeric ID from IBKR FlexQuery dashboard

# Crypto-pivot C0-B2b (delta spec §3.1): CDP API key for the
# authenticated Coinbase Advanced Trade surface (orders, fills,
# positions, futures balance summary). Created in the CDP portal
# (portal.cdp.coinbase.com → API keys → trade permission). The
# private key is the ES256 EC key PEM the portal issues — paste it
# as a quoted multi-line string. Mapped to API_COINBASE_API_KEY_NAME /
# API_COINBASE_API_PRIVATE_KEY by services/api/entrypoint.py. The
# public market-data worker (§3.2) needs NO key.
coinbase:
  api_key_name: <TODO_FROM_C0_COINBASE_KEY_CEREMONY>   # organizations/{org}/apiKeys/{key}
  api_private_key: <TODO_FROM_C0_COINBASE_KEY_CEREMONY>  # EC PRIVATE KEY PEM

anthropic:
  api_key: <TODO_FROM_WEEK_5_AGENT_BRINGUP>
  workspace_id: <TODO_FROM_WEEK_5_AGENT_BRINGUP>

discord:
  bot_token: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>            # see deploy/discord/README.md
  guild_id: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
  # Day 23: shared bearer for discord_bot <-> api auth. 32-byte URL-safe
  # base64; generated via `python3 -c 'import secrets; print(secrets.token_urlsafe(32))'`.
  api_bearer_token: <TODO_FROM_DAY_23_DISCORD_BOT_BRINGUP>
  webhook_urls:
    daily_brief: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
    signals: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
    fills: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
    alerts: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
    critical: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
    ops: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>
    audit: <TODO_FROM_DAY_2_DISCORD_RUNBOOK>

