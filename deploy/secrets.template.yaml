# deploy/secrets.template.yaml — schema for the host secrets file.
#
# Crypto-pivot secrets amendment (operator-approved 2026-07-09, see
# Docs/decisions-log.md): the sops/age pipeline is RETIRED. Secrets live
# in ONE plain-YAML file on the VPS, outside the repo working tree:
#
#     /opt/trading-secrets/secrets.yaml     (root-authored; the bringup
#                                            script sets uid 1000 + 0400)
#
# NEVER commit a filled copy of this file. The repo carries only this
# template; gitleaks CI + .gitignore block plaintext secrets ([A11]).
# Recovery model: if the VPS is lost, every value below is re-issued
# from its provider dashboard — see deploy/crypto-vps-bringup.md
# Appendix A for the per-key re-issue runbook.
#
# Formatting rules (the api entrypoint fails closed on violations):
#   * Quote any long all-digit value ("152748..."), otherwise YAML
#     numeric coercion turns it into a float and mangles it — the
#     entrypoint detects float leaves and exits 2.
#   * Multi-line values (the Coinbase PEM) use the `|` block style with
#     consistent indentation.
#   * `<TODO_...>` placeholders are treated as unset (fail-closed for
#     required keys; feature-off for optional ones).

postgres:
  # Generated at bringup via `openssl rand -hex 32` (two different values).
  # day5-bringup.sh reads these and ALTER ROLEs the app users to match.
  app_service_password: <TODO_BRINGUP>
  app_owner_password: <TODO_BRINGUP>

# CDP API key for the authenticated Coinbase Advanced Trade surface
# (orders/fills/positions/balance). Created at portal.cdp.coinbase.com →
# API keys → ECDSA (ES256) signature → View + Trade permissions ONLY
# (no Transfer) → IP-allowlist the VPS. The private key is the EC PEM
# the portal issues — paste it with the `|` block style, one PEM line
# per line. The public market-data worker needs NO key.
coinbase:
  api_key_name: <TODO_CDP_PORTAL>   # organizations/{org}/apiKeys/{key}
  api_private_key: <TODO_CDP_PORTAL>
  # Filled example shape:
  #   api_key_name: "organizations/abc.../apiKeys/def..."
  #   api_private_key: |
  #     -----BEGIN EC PRIVATE KEY-----
  #     ...
  #     -----END EC PRIVATE KEY-----

