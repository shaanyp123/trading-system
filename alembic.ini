; Alembic config — Postgres 16 schema migrations for the trading system.
;
; Connection URL is read from the DATABASE_URL env var (set by the runtime
; from sops; see backend-spec §8.1.3). This file deliberately does NOT carry
; a sqlalchemy.url — bare config = no plaintext connection string in the repo.
;
; Migrations live at alembic/versions/. Filename convention: 0001_<topic>.py
; (numeric, monotonic; matches implementation-guide §11 Day 3 task spec).

[alembic]
script_location = alembic
version_path_separator = os
path_separator = os
prepend_sys_path = .
timezone = UTC

; Don't truncate auto-generated migration filenames.
truncate_slug_length = 80

; Output format for `alembic revision`.
file_template = %%(rev)s_%%(slug)s

; sqlalchemy.url is intentionally unset — env.py reads DATABASE_URL.

[post_write_hooks]
; ruff format runs after generating new migration files.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
