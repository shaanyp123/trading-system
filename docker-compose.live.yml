# docker-compose.live.yml — live-money cutover compose stack.
#
# STANDALONE compose file (NOT an overlay on docker-compose.yml). Runs as a
# SEPARATE compose project (`trading-live`) on the same VPS, alongside the
# existing paper project (`trading`). Paper continues uninterrupted; live
# runs in parallel with isolated networks + volumes + IBKR session.
#
# Operator command at cutover (per Docs/live-money-cutover-plan.md §10):
#
#   docker compose -p trading-live --env-file deploy/.env.live \
#       -f docker-compose.live.yml up -d
#
# The `-p trading-live` flag prefixes all volume + network names with
# `trading-live_`, so:
#   * `trading-live_postgres_data` — live's Postgres data (isolated from paper)
#   * `trading-live_internal`      — live private network
#   * `trading-live_egress`        — live's internet egress (for IBKR FlexQuery)
#
# SCOPE — what this file currently DOES include:
#   * postgres    — live database (isolated volume)
#   * api         — FastAPI + workers (joined to internal + egress)
#
# Crypto-pivot C0 (2026-07-08): ib_gateway, autoheal, and the api's
# bar_sync/lean surfaces RETIRED (delta spec §1). The live stack will gain
# its Coinbase-facing config at Phase C1 (small-live cutover).
#
# SCOPE — what's NOT yet included (follow-up sessions; cutover-blocker
# evaluation per Docs/live-money-cutover-plan.md Appendix A):
#   * caddy       — paper's Caddy serves both apex (paper) + live subdomain;
#                   see deploy/Caddyfile live block. Cross-project networking
#                   for paper's Caddy → live's api resolves at cutover-day
#                   per the comment in the Caddyfile.
#   * webhook_pusher — Discord/email pusher. Cross-env channel routing
#                   resolves at cutover day (paper + live share channels
#                   per L11; embed tag distinguishes).
#   * nextjs      — frontend at live.spratcapital.com. Same image as paper;
#                   config differs (NEXT_PUBLIC_API_BASE).
#   * discord_bot — slash commands target live api via different bearer token
#                   (S10 in the live secrets file).
#
# Anti-pattern A18 enforced — no bare `<your-domain>`; substitute via env.

networks:
  internal:
    driver: bridge
    internal: true       # no internet egress except via `egress`
  egress:
    driver: bridge

volumes:
  postgres_data:

# Persistent log retention — see docker-compose.yml `x-journald-logging`
# block for the full rationale (2026-05-27 incident: 17:09 UTC api recreate
# destroyed pre-restart json-file logs). journald driver pipes container
# stdout/stderr to host systemd journal (`/var/log/journal/`), which
# survives container recreate trivially. `docker logs <container>` still
# works; `journalctl CONTAINER_NAME=trading-live-api-1 --since "1h ago"`
# adds forensic queryability. Pre-deploy operator steps documented in the
# PR description.
x-journald-logging: &journald-logging
  driver: journald
  options:
    tag: "{{.Name}}"

services:

  # ---- API (FastAPI + uvicorn + workers) -------------------------------
  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env.live}/trading-api:${RELEASE_SHA:-latest}
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal, egress]
    environment:
      API_ENVIRONMENT: ${ENVIRONMENT:-live-small}
      API_VERSION: ${RELEASE_SHA:-dev}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_DB_HOST: postgres
      API_DB_NAME: trading
      # Crypto-pivot C0-B2b: the IBKR port/account/clientId + EOD
      # position-source passthroughs died with the IBKR execution layer.
    volumes:
      # Live secrets dir is DISTINCT from paper's so a paper-side
      # secrets accident can't bleed into live's runtime. Operator's pre-cutover
      # ceremony populates SECRETS_DIR per deploy/.env.example.live.
      - ${SECRETS_DIR:-/opt/trading-secrets-live}:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---- Datastore --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in deploy/.env.live}
      POSTGRES_DB: trading
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
