# docker-compose.yml — production stack (Hetzner Ashburn primary VPS).
# Service inventory: backend-spec §1.4 (19 services).
#
# Profile gating:
#   default (no profile)  — Day 5 deploy subset: caddy, api, postgres.
#   phase1                — services that ship Phase 0 Week 2+ (signal, risk,
#                           execution, …). Activated with `--profile phase1`.
#   phase2                — direct-IBKR services (ib_gateway, lean_local).
#                           Activated with `--profile phase2`.
#
# Image tag substitution: GHCR_OWNER + RELEASE_SHA come from `deploy/.env` on
# the VPS. Anti-pattern A18: never bare placeholders like <domain>; substitute
# via env at deploy.

networks:
  internal:
    driver: bridge
    internal: true       # no internet egress except via the `egress` network
  egress:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  gitea_data:
  # Pivot-PR-A (post-pivot 2026-05-12): LEAN's data directory. LEAN
  # downloads + caches QC bundled historical bars here at first run. The
  # operator can pre-populate this volume by mounting a directory of
  # downloaded LEAN data, or let LEAN download fresh at container start
  # (slower first cycle but no operator-side prep needed).
  lean_data:

services:

  # ---- Reverse proxy / TLS ----------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [internal, egress]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      WATCHDOG_IP: ${WATCHDOG_IP:?set WATCHDOG_IP in deploy/.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    # Process-existence probe. Originally tried Caddy's admin API on
    # localhost:2019, but our Caddyfile global block doesn't enable the
    # admin server explicitly + the alpine default has it disabled in
    # production builds (verified 2026-05-16 deploy smoke: wget to :2019
    # got Connection refused on a healthy Caddy). Public-port probes
    # also don't work — Caddy redirects http→https and there's no cert
    # for localhost, so wget gets a TLS handshake failure.
    #
    # pgrep is the simplest reliable signal: caddy:2-alpine ships
    # pgrep via busybox + the entrypoint runs as PID 1 named "caddy".
    # When the Caddy process is alive, pgrep returns 0; when it dies,
    # tini exits + container restarts.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f caddy || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- API (FastAPI + uvicorn) -----------------------------------------
  # Phase 0 Day 5 brings this up. `build:` lets the operator build locally
  # on the VPS via `docker compose build api` for the first deploy; once
  # CI publishes to GHCR (`docker-build` job), `docker compose pull api`
  # works and `image:` is honored.
  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-api:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    # The api needs egress in addition to internal to reach IBKR's
    # FlexQuery REST endpoint at ndcdyn.interactivebrokers.com (used
    # by the reconciliation scheduler at services/reconciliation/**).
    # Pre Worker-PR-3a (2026-05-12) the api was internal-only and
    # FlexQuery calls failed at DNS resolution. The Caddy reverse-proxy
    # path to /api remains via the internal network — egress only
    # affects outbound DNS+TCP from the api container itself.
    networks: [internal, egress]
    environment:
      API_ENVIRONMENT: ${ENVIRONMENT:-paper}
      API_VERSION: ${RELEASE_SHA:-dev}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_DB_HOST: postgres
      API_DB_NAME: trading
      # TWS API clientId (1-7 per IBKR's docs). Default 1 matches the api's
      # config.py + ibkr_adapter.py constants. Override to 2-7 via deploy/.env
      # when clientId=1 is held by IBKR's server-side session table after an
      # uncleanly-disconnected prior session (the post-pivot 2026-05-17
      # "Error 326: client id is already in use" wedge that can persist 30+
      # minutes past container restart). See decisions-log 2026-05-17 entry.
      API_IBKR_CLIENT_ID: ${API_IBKR_CLIENT_ID:-1}
      # Bar-sync worker clientId (data-layer-pivot-v2 Option C 2026-05-20).
      # Default 2 per dev-guide §1.5 LOCKED (api worker=1, bar_sync=2,
      # probes=80-99, reserve 3-7). When the operator has overridden
      # API_IBKR_CLIENT_ID into the 2-7 range (e.g., 2026-05-17 prior-
      # session-wedge workaround set order worker to 2), this MUST be set
      # to a different non-overlapping value (e.g., 3) in deploy/.env to
      # avoid Error 326 "client id is already in use" at the 17:00 ET
      # bar_sync cycle. The api boot logs explicitly call out the
      # configured value via `bar_sync_worker_spawned ibkr_client_id=N`.
      API_BAR_SYNC_CLIENT_ID: ${API_BAR_SYNC_CLIENT_ID:-2}
    # Bind-mount the host-decrypted secrets directory. `deploy/day5-bringup.sh`
    # runs `sops -d` on the host and writes /opt/trading/secrets-decrypted/
    # decrypted.yaml — the api entrypoint reads it at /run/secrets/decrypted.yaml.
    # SECRETS_DIR is set in deploy/.env (default kept here for clarity).
    #
    # `lean_data` mount (post data-layer-pivot-v2 2026-05-20 evening; Option C):
    # the api's BarSyncWorker (services/data/bar_sync.py) needs WRITE access
    # to /Lean/Data/ so it can populate equity-daily zips, futures-daily
    # zips, per-day universe CSVs, and map_file sentinels. lean_local
    # mounts the same volume READ-ONLY (see lean_local volumes block
    # below). This is the canonical separation: api owns the data
    # producer role on clientId=2; lean_local consumes via the original
    # FakeDataQueue + SubscriptionDataReaderHistoryProvider path.
    volumes:
      - ${SECRETS_DIR:-/opt/trading/secrets-decrypted}:/run/secrets:ro
      - lean_data:/Lean/Data:rw
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---- Datastores --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in deploy/.env}
      POSTGRES_DB: trading
      # Tighter than postgres-default; relaxed in 0001_audit_log.py for the
      # SERIALIZABLE audit chain.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Phase 0 Week 2+ services (profile-gated until Dockerfile lands) -
  # Each ships its own Dockerfile + tests in a follow-on PR; until then,
  # the `phase1` profile keeps `docker compose up` from trying to pull
  # ghcr.io tags that don't exist.
  signal:
    image: ghcr.io/${GHCR_OWNER}/trading-signal:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  risk:
    image: ghcr.io/${GHCR_OWNER}/trading-risk:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  execution:
    image: ghcr.io/${GHCR_OWNER}/trading-execution:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal, egress]   # Phase 1 needs QC ObjectStore reach
    profiles: ['phase1']
    depends_on: [postgres, qc_adapter]

  reconciliation:
    image: ghcr.io/${GHCR_OWNER}/trading-reconciliation:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres, qc_adapter]

  audit:
    image: ghcr.io/${GHCR_OWNER}/trading-audit:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  calibration:
    image: ghcr.io/${GHCR_OWNER}/trading-calibration:${RELEASE_SHA:-latest}
    restart: 'on-failure:3'
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/trading-scheduler:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  # qc_adapter — QC ObjectStore poll worker.
  #
  # POST-PIVOT 2026-05-12 (Pivot-PR-A): DORMANT under the `qc_adapter_backfill`
  # docker-compose profile. Default `docker compose up -d` skips this service.
  # Bring up only for ad-hoc historical replay via:
  #
  #     docker compose --profile qc_adapter_backfill up -d qc_adapter
  #
  # See backend-spec §1.4 + §2.11 (post-pivot) for the dormant role + spec
  # `Docs/decisions-log.md` 2026-05-12 entry for the full pivot rationale.
  # The container's 50 unit + integration tests still run in CI as a
  # regression net against accidentally re-introducing ObjectStore polling.
  #
  # Pre-pivot description: "Polls QC's REST surface for signal_emitted +
  # order_filled + reconciliation events at 60s/60s/5s cadences (per
  # backend-spec §3.19 + §1.4); writes parsed events to audit_log + signals
  # + data_quality_events." Retired because QC's `/object/get` endpoint is
  # gated behind the Institutional subscription tier (DP-025).
  qc_adapter:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-qc-adapter:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/qc_adapter/Dockerfile
    restart: unless-stopped
    networks: [internal, egress]
    profiles: ['qc_adapter_backfill']
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-paper}
      LOG_LEVEL: ${QC_ADAPTER_LOG_LEVEL:-INFO}
      QC_ADAPTER_PHASE_AT_EMIT: ${QC_ADAPTER_PHASE_AT_EMIT:-0}
      # QC_ADAPTER_DATABASE_URL, QC_ADAPTER_QC_USER_ID, QC_ADAPTER_QC_API_TOKEN
      # come in via the sops-decrypted bundle volume below + the
      # entrypoint reads them with the env_prefix QC_ADAPTER_.
    volumes:
      - ${SECRETS_DIR:-/opt/trading/secrets-decrypted}:/run/secrets:ro
    depends_on: [postgres]

  # Discord bot — Day 23 (Week 6 Thu) onwards. Default profile (no
  # --profile) per the Phase 0 surface phasing in frontend-spec §6.1
  # (LOCKED — /positions + /halt + /status ship Phase 0). Networks:
  #   internal — bot calls api over http://api:8000 (no Caddy hop)
  #   egress   — Discord gateway WebSocket (gateway.discord.gg) needs
  #              outbound TLS
  # Auth: shared sops-decrypted bearer token per backend-spec §6.6 +
  # §4.4. The api-side validator is services/api/middleware.BotAuthMiddleware.
  # See deploy/discord_bot/README.md for the operator runbook.
  discord_bot:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-discord-bot:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/discord_bot/Dockerfile
    restart: unless-stopped
    networks: [internal, egress]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-paper}
      LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
      API_BASE_URL: ${BOT_API_BASE_URL:-http://api:8000}
      # DISCORD_BOT_TOKEN, DISCORD_GUILD_ID, DISCORD_BOT_API_BEARER_TOKEN
      # come in via the sops-decrypted bundle volume below + the bot's
      # entrypoint reads them as bare DISCORD_*/* env vars (no API_*
      # prefix — bot's pydantic-settings uses env_prefix="").
    volumes:
      - ${SECRETS_DIR:-/opt/trading/secrets-decrypted}:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    # Process-existence probe. The bot's main loop is a discord.py
    # gateway WebSocket connection — no HTTP listener to hit. If
    # `services.discord_bot.entrypoint` died but tini (PID 1) is still
    # alive, the container would otherwise look healthy. pgrep matches
    # the full command line so tini's own argv doesn't false-positive.
    # procps installed in services/discord_bot/Dockerfile runtime stage.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f services.discord_bot || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  webhook_pusher:
    # PR #106 follow-up (2026-05-12): long-lived SSE subscriber. Drains
    # the api's /api/sse/events stream and POSTs Discord embeds to the
    # #signals + #fills channels (via discord.webhook_urls.signals /
    # .fills from sops). The operator's alert smoke runbook
    # (deploy/webhook_pusher/README.md) still works via `docker compose
    # exec webhook_pusher /opt/venv/bin/python -m services.webhook_pusher.cli ...`
    # because the cli module is intact.
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-webhook-pusher:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/webhook_pusher/Dockerfile
    restart: unless-stopped
    networks: [internal, egress]
    environment:
      WEBHOOK_PUSHER_LOG_LEVEL: ${WEBHOOK_PUSHER_LOG_LEVEL:-INFO}
    volumes:
      # Sops-decrypted bundle mount (same pattern as api + lean_local).
      # entrypoint.sh reads /run/secrets/decrypted.yaml.
      - ${SECRETS_DIR:-/opt/trading/secrets-decrypted}:/run/secrets:ro
    depends_on: [postgres]
    # Process-existence probe. The SSE subscriber is a long-lived Python
    # loop with no HTTP listener — pgrep is the closest signal we have
    # to "is the consumer still draining /api/sse/events". If the python
    # process died but tini (PID 1) is alive, this returns 1 and Compose
    # restarts the container. procps installed in
    # services/webhook_pusher/Dockerfile runtime stage.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f services.webhook_pusher || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---- Next.js frontend (web UI) ----------------------------------------
  # Day 20 (Week 6 Mon): scaffold + 10 placeholder routes. Phase 0 Wed
  # wires the Today page to real data; Phase 1+ adds auth-gated routes
  # + SSE proxying. internal-only network — never exposes a public
  # port; Caddy reverse-proxies the apex `/` → nextjs:3000 (the route
  # already exists in deploy/Caddyfile from Day 5). Bringing this
  # service up resolves the Day-19 root-`/` 503 maintenance fallback.
  nextjs:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-web:${RELEASE_SHA:-latest}
    build:
      context: apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [internal]
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://api:8000}
      NEXT_PUBLIC_PHASE: ${NEXT_PUBLIC_PHASE:-0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  monitoring:
    image: ghcr.io/${GHCR_OWNER}/trading-monitoring:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  agent:
    image: ghcr.io/${GHCR_OWNER}/trading-agent:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal, egress]
    profiles: ['phase1']
    depends_on: [postgres]

  # ---- Source mirror ----------------------------------------------------
  gitea:
    image: gitea/gitea:1.21
    restart: unless-stopped
    networks: [internal, egress]
    profiles: ['phase1']
    volumes:
      - gitea_data:/data

  # ---- Observability (Phase 1 month 2) -----------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  # ---- IBKR Gateway (Pivot-PR-B; post-pivot 2026-05-12) ----------------
  #
  # gnzsnz/ib-gateway-docker hosts IB Gateway (IBKR's TWS API gateway) in
  # a container. The `services/execution/ibkr_adapter.py` connects via
  # `ib-async` to this container on port 4004 (paper) / 4003 (live) — the
  # externally-published socat ports per gnzsnz convention. The internal
  # IB Gateway listens on 127.0.0.1:4002 (paper) / :4001 (live) inside the
  # container, but those ports are not reachable from outside; socat
  # forwards from 0.0.0.0:4004/4003 to the internal listener. Discovered
  # at Pivot-PR-B Step 5 smoke 2026-05-12.
  #
  # Networks: `internal` ONLY. NOT exposed to Caddy or the public internet.
  # The TWS API protocol is unauthenticated at the network layer (auth is
  # via username/password at session-open + the `clientId`); exposing 4003/4004
  # publicly would let anyone with the credentials place orders. Keep on
  # the internal Docker network only.
  #
  # Credentials: TWS_USERID + TWS_PASSWORD from sops `ibkr.paper_username`/
  # `ibkr.paper_password` (paper) or `ibkr.live_username`/`ibkr.live_password`
  # (live). The image's entrypoint reads them directly; we mount the sops
  # bundle as a secret + the operator runbook
  # (`deploy/ibkr/README.md`) walks through wiring.
  #
  # TRADING_MODE env var flips paper vs live (controls which port the
  # gateway listens on + which IBKR account it connects to).
  ib_gateway:
    image: ghcr.io/gnzsnz/ib-gateway:stable
    restart: unless-stopped
    networks: [internal, egress]
    environment:
      # paper or live; flipped at deploy time via deploy/.env LEAN_LIVE_MODE
      TWS_USERID: ${IB_GATEWAY_USERNAME:-}
      TWS_PASSWORD: ${IB_GATEWAY_PASSWORD:-}
      TRADING_MODE: ${IB_GATEWAY_MODE:-paper}
      # gnzsnz image-specific config — read at boot.
      VNC_SERVER_PASSWORD: ${IB_GATEWAY_VNC_PASSWORD:-}
      TZ: America/New_York
      # IBC (IB Controller) settings — auto-login + auto-restart at scheduled
      # IBKR maintenance windows (which would otherwise need manual restart).
      AUTO_RESTART_TIME: '11:59 PM'
      RELOGIN_AFTER_TWOFA_TIMEOUT: 'yes'
      TWOFA_DEVICE: 'YubiKey'  # operator's chosen 2FA device per Day 4 carryover
      # TWS_ACCEPT_INCOMING + READ_ONLY_API populate gnzsnz's IBC config.ini
      # template (verified at /home/ibgateway/ibc/config.ini.tmpl). Without
      # TWS_ACCEPT_INCOMING=accept the gateway pops a headless "Accept incoming
      # connection from <api-container-IP>" dialog on every TWS API connect
      # and hangs the handshake (TCP socket open but apiStart never resolves).
      # Discovered Pivot-PR-B Step 5 smoke 2026-05-12. READ_ONLY_API=no is
      # required for placeOrder/cancelOrder; empty defaults to read-only.
      TWS_ACCEPT_INCOMING: 'accept'
      READ_ONLY_API: 'no'
      # EXISTING_SESSION_DETECTED_ACTION populates IBC's config.ini
      # `ExistingSessionDetectedAction` setting (same image template as
      # TWS_ACCEPT_INCOMING). Without this, IBC defaults to `manual` and
      # pops a headless "Existing session detected — keep this session or
      # exit?" dialog whenever a second client logs into the same account
      # (e.g., operator's TWS Desktop is open against DUQ825170 paper while
      # the gateway tries to reconnect after IBKR's overnight maintenance
      # window restart). The dialog hangs until clicked; meanwhile IBKR
      # emits Error 1100 ("connectivity lost") and orderStatus events stop
      # propagating to the api even though the API socket stays open.
      # Discovered 2026-05-18 drill 5; see `Docs/decisions-log.md` entry.
      #
      # `primary` = this gateway session WINS, kicks the other client.
      # The backend is authoritative; operator must reconnect TWS Desktop
      # manually after each gateway restart. Documented tradeoff in
      # `deploy/ibkr/README.md` "Existing session collisions" section.
      EXISTING_SESSION_DETECTED_ACTION: 'primary'
    healthcheck:
      # Probe the externally-published socat port (4004 paper / 4003 live)
      # rather than the internal gateway port (4002/4001). Inside the
      # container, both bind to localhost, but probing the socat port
      # catches the failure mode where the gateway listens but socat dies
      # — which would silently break every external caller. Use bash's
      # /dev/tcp pseudo-device because `nc` is NOT installed in the
      # gnzsnz/ib-gateway:stable image (verified at deploy-time
      # 2026-05-12); bash IS installed (/usr/bin/bash).
      test: ['CMD-SHELL', 'bash -c "</dev/tcp/localhost/4004" 2>/dev/null || bash -c "</dev/tcp/localhost/4003" 2>/dev/null || exit 1']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s  # IBC takes ~90s to log in fresh

  # lean_local — LEAN algorithm engine (Pivot-PR-A; post-pivot 2026-05-12).
  #
  # Runs LEAN on the operator's Hetzner VPS. Mounts `./lean/` as the
  # algorithm directory + `./strategies/` for shared Python. POSTs signal
  # events to `http://api:8000/api/internal/lean/signals` using the shared
  # bearer from sops `lean.api_bearer_token`.
  #
  # **Image tag rationale (2026-05-16 fix):** prior to today the `image:`
  # field was `quantconnect/lean:latest` — the same tag as the upstream
  # public LEAN image. Our `infrastructure/lean_local/Dockerfile` extends
  # the upstream image (custom entrypoint that resolves sops bundle +
  # deep-merges lean.json onto upstream config.json). When the local
  # image gets re-tagged via our build, it overwrites the upstream tag in
  # the local docker registry. But `docker compose up -d` without a
  # preceding `docker compose build lean_local` will re-pull the pristine
  # upstream image + clobber our custom layer. Discovered during the
  # 2026-05-16 deploy: lean_local silently ran upstream's
  # `BasicTemplateFrameworkAlgorithm` for hours instead of our
  # `V1TrendFollowingAlgorithm` because the operator had `up -d`'d after
  # `git pull` without rebuilding.
  #
  # Fix: image tag is now GHCR-namespaced (`ghcr.io/${GHCR_OWNER}/
  # trading-lean-local:${RELEASE_SHA:-latest}`) matching the convention
  # used by api/nextjs/discord_bot/webhook_pusher. `docker compose pull`
  # won't ever collide with the upstream tag. The operator must
  # `docker compose build lean_local` after upgrading the LEAN base
  # image OR pushing strategy code changes (Phase 1+ CI publishes the
  # built image to GHCR; today it's built locally on the VPS).
  #
  # Networks: `internal` only (no egress; QC bundled data is mounted as a
  # volume; live market data flows via `ib_gateway` on the internal net
  # when Pivot-PR-B lands).
  #
  # The container runs in BACKTEST mode by default until Pivot-PR-B wires
  # `ib_gateway`. To switch to paper trading (live-mode against IBKR paper),
  # the operator sets `LEAN_LIVE_MODE=true` in `deploy/.env` after
  # Pivot-PR-B confirms IBKR paper account access.
  #
  # See `deploy/lean_local/README.md` for the operator runbook.
  lean_local:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-lean-local:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: infrastructure/lean_local/Dockerfile
    restart: unless-stopped
    # Internal-only network (post data-layer-pivot-v2 2026-05-20 evening;
    # Option C). The v1 attempt at the 2026-05-20 sub-pivot added `egress`
    # so the QC IBKR plugin could hit www.quantconnect.com:443 for
    # ValidateSubscription(); the v2 architecture (api fetches bars on
    # clientId=2 + writes to disk; LEAN reads via FakeDataQueue) does NOT
    # need the QC plugin or any external HTTPS reach from lean_local.
    # Reverted to `[internal]` only — LEAN talks to api over the internal
    # Docker network (for the `POST /api/internal/lean/signals` path) +
    # reads bars from the shared `lean_data` volume.
    networks: [internal]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-paper}
      LEAN_LIVE_MODE: ${LEAN_LIVE_MODE:-false}
      LEAN_LOCAL_API_BASE_URL: ${LEAN_LOCAL_API_BASE_URL:-http://api:8000}
      # LEAN_LOCAL_BEARER_TOKEN comes in via the sops-decrypted bundle
      # volume below + the lean_local entrypoint reads sops yaml
      # `lean.api_bearer_token` → env var.
    volumes:
      # Algorithm code + shared strategy package mount.
      - ./lean:/Lean/Algorithm:ro
      # Lowercase mount path — `strategies` is a Python package name; the
      # internal absolute imports in the package use `from
      # strategies.v1_trend_following.X import Y`, which requires the
      # package directory to be reachable as `strategies` (lowercase) from
      # PYTHONPATH. Pivot-PR-D 2026-05-12 fixup: mount was `Strategies`
      # (uppercase) which exposed `v1_trend_following` at top level but
      # not the `strategies.*` namespace, breaking sibling imports.
      - ./strategies:/Lean/strategies:ro
      # LEAN data directory (post data-layer-pivot-v2 2026-05-20 evening):
      # READ-ONLY mount of the shared lean_data volume. The api's
      # BarSyncWorker (services/data/bar_sync.py; api side has rw mount
      # of the same volume) writes daily-resolution OHLCV bars +
      # per-day universe CSVs + map_file sentinels here; lean_local
      # consumes via FakeDataQueue + SubscriptionDataReaderHistoryProvider.
      - lean_data:/Lean/Data:ro
      # sops-decrypted bundle for bearer-token resolution at boot.
      - ${SECRETS_DIR:-/opt/trading/secrets-decrypted}:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    # Probe the LEAN launcher process. The quantconnect/lean:latest
    # image ships procps under the dotnet/Ubuntu base; pgrep is at
    # /usr/bin/pgrep. The .dll path matches the CMD verbatim
    # (`/Lean/Launcher/bin/Debug/QuantConnect.Lean.Launcher.dll`) so a
    # crashed launcher trips the check while tini (PID 1) stays alive.
    # start_period covers LEAN's ~60s warm-up before the first cycle.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f QuantConnect.Lean.Launcher || exit 1']
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 90s
