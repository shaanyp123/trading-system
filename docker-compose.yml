# docker-compose.yml — production stack (Hetzner Ashburn primary VPS).
# Service inventory: backend-spec §1.4 (19 services).
#
# Profile gating:
#   default (no profile)  — Day 5 deploy subset: caddy, api, postgres.
#   phase1                — services that ship Phase 0 Week 2+ (signal, risk,
#                           execution, …). Activated with `--profile phase1`.
#   phase2                — RETIRED profile (crypto-pivot C0 2026-07-08):
#                           its services (ib_gateway, lean_local) are gone.
#
# Image tag substitution: GHCR_OWNER + RELEASE_SHA come from `deploy/.env` on
# the VPS. Anti-pattern A18: never bare placeholders like <domain>; substitute
# via env at deploy.

networks:
  internal:
    driver: bridge
    internal: true       # no internet egress except via the `egress` network
  egress:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
  gitea_data:
  # Pivot-PR-A (post-pivot 2026-05-12): LEAN's data directory. LEAN
  # downloads + caches QC bundled historical bars here at first run. The
  # operator can pre-populate this volume by mounting a directory of
  # downloaded LEAN data, or let LEAN download fresh at container start
  # (slower first cycle but no operator-side prep needed).

# ---- Persistent log retention -----------------------------------------------
# Forensic-data preservation across container recreate (2026-05-27).
#
# **Why this exists.** Today's incident lost the pre-restart api logs: api was
# redeployed at 17:09 UTC and the old container's `json-file` log
# (/var/lib/docker/containers/<old-id>/<old-id>-json.log) was destroyed with
# the container. The M2K orderStatus events were impossible to reconstruct
# after the fact. Default Docker behavior is to delete a container's log file
# when the container itself is removed — which `docker compose up -d` does
# every time the image tag changes (i.e., every release).
#
# **Mechanism — journald log driver.** Docker's `journald` driver pipes
# container stdout/stderr to the host's systemd journal
# (`/var/log/journal/`), NOT to per-container directories under
# `/var/lib/docker/containers/`. The journal is host-owned, so it survives
# container recreate trivially. `docker logs <container>` still works
# (Docker reads from journald transparently when the driver is journald);
# `journalctl` adds forensic queryability across container generations.
#
# **Why not the literal "json-file with bind-mount" pattern.** Docker's
# `json-file` driver writes to `/var/lib/docker/containers/<id>/<id>-json.log`
# and provides no per-service `path` option in compose — you cannot relocate
# its output to a bind-mounted `/var/log/trading/<service>/` without
# modifying application behavior (e.g., teeing stdout via a wrapper). The
# `local` driver has the same constraint. Adding `max-size` + `max-file`
# to json-file gives intra-container rotation but does NOT survive
# container recreate — the directory is removed with the container.
# journald is the canonical Docker-supported answer for "logs survive
# container recreate, no app changes, queryable from host."
#
# **Retention bounds.** journald rotation is host-configured via
# `/etc/systemd/journald.conf` (defaults: `SystemMaxUse=4G` or 10% of disk,
# whichever is smaller; persistent storage at `/var/log/journal/`). The
# operator pre-deploy step (see PR description) bumps these to keep ~7
# days of all-container output, which exceeds the 24h forensic window
# we need for incidents like today's. Per-service caps via `journald`
# driver options are NOT supported — bounding is global at the journald
# level, which is fine because the goal is host-level retention, not
# per-container.
#
# **Operator query patterns.** All journald entries from compose-managed
# containers carry `CONTAINER_NAME=trading-<service>-<n>` and the `tag`
# below populates `SYSLOG_IDENTIFIER`/`CONTAINER_TAG`:
#   journalctl CONTAINER_NAME=trading-api-1 --since "1 hour ago"
#   journalctl CONTAINER_TAG=trading-api-1 --since "2026-05-27 17:00"
#   journalctl -u docker --since "1 hour ago"  # all docker output
# Forensic exports for incident packets:
#   journalctl CONTAINER_NAME=trading-api-1 --since "@<unix-ts>" \
#       --until "@<unix-ts>" --output=json > /tmp/incident-api.jsonl
#
# **Trade-offs.**
#   - `docker logs --since` works but is bounded by journald's retention,
#     not the (now-gone) per-container file. After today, that's an
#     improvement (more retention, not less).
#   - journald format is not the same as raw json-file. Tools that grep
#     `/var/lib/docker/containers/.../-json.log` directly will need to
#     migrate to `journalctl` — verified no in-repo scripts do this.
#   - Disk usage moves from `/var/lib/docker/containers/` to
#     `/var/log/journal/`. Both are on the root volume on Hetzner; net
#     disk impact is roughly neutral.
#
# **Pre-deploy operator steps** (one-time on the VPS; documented in PR):
#   1. Ensure persistent journal: `sudo mkdir -p /var/log/journal &&
#      sudo systemctl restart systemd-journald` (idempotent — directory
#      may already exist on modern systemd).
#   2. Bump retention if desired: edit /etc/systemd/journald.conf,
#      set `SystemMaxUse=8G` (or appropriate cap), then
#      `sudo systemctl restart systemd-journald`.
#   3. `docker compose up -d` (normal flow) — new containers pick up the
#      journald driver. Old containers continue with their existing
#      driver until next recreate; force-recreate if immediate cutover
#      is needed: `docker compose up -d --force-recreate`.
#
# **Applied to.** All stateful services that emit forensically useful
# diagnostics in the default + phase2 profile (today's operational
# surface): caddy, api, postgres, nextjs, discord_bot, webhook_pusher.
# Profile-gated `phase1` services (signal, risk, execution,
# reconciliation, audit, calibration, scheduler, monitoring, agent,
# prometheus, grafana, gitea) are skipped — they don't run on the
# active stack today, so adding the driver field there is noise. They
# can adopt the same pattern when their Dockerfiles land.
# Crypto-pivot C0 (2026-07-08): ib_gateway, lean_local, autoheal, and
# qc_adapter services RETIRED (delta spec §1).
x-journald-logging: &journald-logging
  driver: journald
  options:
    # tag populates journald's SYSLOG_IDENTIFIER + CONTAINER_TAG. Using
    # `{{.Name}}` (compose service name) gives a stable, predictable
    # identifier independent of container ID, so
    # `journalctl CONTAINER_TAG=trading-api` works across recreates.
    tag: "{{.Name}}"

services:

  # ---- Reverse proxy / TLS ----------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal, egress]
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
      WATCHDOG_IP: ${WATCHDOG_IP:?set WATCHDOG_IP in deploy/.env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    # Process-existence probe. Originally tried Caddy's admin API on
    # localhost:2019, but our Caddyfile global block doesn't enable the
    # admin server explicitly + the alpine default has it disabled in
    # production builds (verified 2026-05-16 deploy smoke: wget to :2019
    # got Connection refused on a healthy Caddy). Public-port probes
    # also don't work — Caddy redirects http→https and there's no cert
    # for localhost, so wget gets a TLS handshake failure.
    #
    # pgrep is the simplest reliable signal: caddy:2-alpine ships
    # pgrep via busybox + the entrypoint runs as PID 1 named "caddy".
    # When the Caddy process is alive, pgrep returns 0; when it dies,
    # tini exits + container restarts.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f caddy || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---- API (FastAPI + uvicorn) -----------------------------------------
  # Phase 0 Day 5 brings this up. `build:` lets the operator build locally
  # on the VPS via `docker compose build api` for the first deploy; once
  # CI publishes to GHCR (`docker-build` job), `docker compose pull api`
  # works and `image:` is honored.
  api:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-api:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    logging: *journald-logging
    # The api needs egress in addition to internal to reach Coinbase's
    # Advanced Trade REST + WS endpoints (api.coinbase.com /
    # advanced-trade-ws.coinbase.com — the market-data worker, the
    # reconciliation scheduler's EOD fetcher, and the execution layer).
    # Historical origin: Worker-PR-3a (2026-05-12) added egress for the
    # IBKR FlexQuery endpoint after DNS-resolution failures on an
    # internal-only api. The Caddy reverse-proxy path to /api remains
    # via the internal network — egress only affects outbound DNS+TCP
    # from the api container itself.
    networks: [internal, egress]
    environment:
      API_ENVIRONMENT: ${ENVIRONMENT:-paper}
      API_VERSION: ${RELEASE_SHA:-dev}
      API_LOG_LEVEL: ${API_LOG_LEVEL:-INFO}
      API_DB_HOST: postgres
      API_DB_NAME: trading
      # Crypto-pivot C0-B2b: the IBKR clientId + EOD position-source
      # passthroughs died with the IBKR execution layer. Coinbase
      # execution credentials arrive via the host secrets file
      # (services/api/entrypoint.py), not compose env.
    # Bind-mount the host secrets directory (plain-YAML secrets.yaml,
    # authored per deploy/secrets.template.yaml — the sops pipeline is
    # retired, decisions-log 2026-07-09). Entrypoints read it at
    # /run/secrets/secrets.yaml. SECRETS_DIR is set in deploy/.env.
    #
    volumes:
      - ${SECRETS_DIR:-/opt/trading-secrets}:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ---- Datastores --------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in deploy/.env}
      POSTGRES_DB: trading
      # Tighter than postgres-default; relaxed in 0001_audit_log.py for the
      # SERIALIZABLE audit chain.
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d trading']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---- Phase 0 Week 2+ services (profile-gated until Dockerfile lands) -
  # Each ships its own Dockerfile + tests in a follow-on PR; until then,
  # the `phase1` profile keeps `docker compose up` from trying to pull
  # ghcr.io tags that don't exist.
  signal:
    image: ghcr.io/${GHCR_OWNER}/trading-signal:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  risk:
    image: ghcr.io/${GHCR_OWNER}/trading-risk:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  execution:
    image: ghcr.io/${GHCR_OWNER}/trading-execution:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal, egress]   # Phase 1 needs QC ObjectStore reach
    profiles: ['phase1']
    depends_on: [postgres]

  reconciliation:
    image: ghcr.io/${GHCR_OWNER}/trading-reconciliation:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  audit:
    image: ghcr.io/${GHCR_OWNER}/trading-audit:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  calibration:
    image: ghcr.io/${GHCR_OWNER}/trading-calibration:${RELEASE_SHA:-latest}
    restart: 'on-failure:3'
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  scheduler:
    image: ghcr.io/${GHCR_OWNER}/trading-scheduler:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  # Discord bot — Day 23 (Week 6 Thu) onwards. Default profile (no
  # --profile) per the Phase 0 surface phasing in frontend-spec §6.1
  # (LOCKED — /positions + /halt + /status ship Phase 0). Networks:
  #   internal — bot calls api over http://api:8000 (no Caddy hop)
  #   egress   — Discord gateway WebSocket (gateway.discord.gg) needs
  #              outbound TLS
  # Auth: shared secrets-file bearer token per backend-spec §6.6 +
  # §4.4. The api-side validator is services/api/middleware.BotAuthMiddleware.
  # See deploy/discord_bot/README.md for the operator runbook.
  discord_bot:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-discord-bot:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/discord_bot/Dockerfile
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal, egress]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-paper}
      LOG_LEVEL: ${BOT_LOG_LEVEL:-INFO}
      API_BASE_URL: ${BOT_API_BASE_URL:-http://api:8000}
      # DISCORD_BOT_TOKEN, DISCORD_GUILD_ID, DISCORD_BOT_API_BEARER_TOKEN
      # come in via the secrets volume below + the bot's
      # entrypoint reads them as bare DISCORD_*/* env vars (no API_*
      # prefix — bot's pydantic-settings uses env_prefix="").
    volumes:
      - ${SECRETS_DIR:-/opt/trading-secrets}:/run/secrets:ro
    depends_on:
      api:
        condition: service_healthy
    # Process-existence probe. The bot's main loop is a discord.py
    # gateway WebSocket connection — no HTTP listener to hit. If
    # `services.discord_bot.entrypoint` died but tini (PID 1) is still
    # alive, the container would otherwise look healthy. pgrep matches
    # the full command line so tini's own argv doesn't false-positive.
    # procps installed in services/discord_bot/Dockerfile runtime stage.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f services.discord_bot || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  webhook_pusher:
    # PR #106 follow-up (2026-05-12): long-lived SSE subscriber. Drains
    # the api's /api/sse/events stream and POSTs Discord embeds to the
    # #signals + #fills channels (via discord.webhook_urls.signals /
    # .fills from the secrets file). The operator's alert smoke runbook
    # (deploy/webhook_pusher/README.md) still works via `docker compose
    # exec webhook_pusher /opt/venv/bin/python -m services.webhook_pusher.cli ...`
    # because the cli module is intact.
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-webhook-pusher:${RELEASE_SHA:-latest}
    build:
      context: .
      dockerfile: services/webhook_pusher/Dockerfile
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal, egress]
    environment:
      WEBHOOK_PUSHER_LOG_LEVEL: ${WEBHOOK_PUSHER_LOG_LEVEL:-INFO}
    volumes:
      # Secrets-file mount (same pattern as api).
      # entrypoint.sh reads /run/secrets/secrets.yaml.
      - ${SECRETS_DIR:-/opt/trading-secrets}:/run/secrets:ro
    depends_on: [postgres]
    # Process-existence probe. The SSE subscriber is a long-lived Python
    # loop with no HTTP listener — pgrep is the closest signal we have
    # to "is the consumer still draining /api/sse/events". If the python
    # process died but tini (PID 1) is alive, this returns 1 and Compose
    # restarts the container. procps installed in
    # services/webhook_pusher/Dockerfile runtime stage.
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f services.webhook_pusher || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---- Next.js frontend (web UI) ----------------------------------------
  # Day 20 (Week 6 Mon): scaffold + 10 placeholder routes. Phase 0 Wed
  # wires the Today page to real data; Phase 1+ adds auth-gated routes
  # + SSE proxying. internal-only network — never exposes a public
  # port; Caddy reverse-proxies the apex `/` → nextjs:3000 (the route
  # already exists in deploy/Caddyfile from Day 5). Bringing this
  # service up resolves the Day-19 root-`/` 503 maintenance fallback.
  nextjs:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER in deploy/.env}/trading-web:${RELEASE_SHA:-latest}
    build:
      context: apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *journald-logging
    networks: [internal]
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://api:8000}
      NEXT_PUBLIC_PHASE: ${NEXT_PUBLIC_PHASE:-0}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  monitoring:
    image: ghcr.io/${GHCR_OWNER}/trading-monitoring:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    depends_on: [postgres]

  agent:
    image: ghcr.io/${GHCR_OWNER}/trading-agent:${RELEASE_SHA:-latest}
    restart: unless-stopped
    networks: [internal, egress]
    profiles: ['phase1']
    depends_on: [postgres]

  # ---- Source mirror ----------------------------------------------------
  gitea:
    image: gitea/gitea:1.21
    restart: unless-stopped
    networks: [internal, egress]
    profiles: ['phase1']
    volumes:
      - gitea_data:/data

  # ---- Observability (Phase 1 month 2) -----------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    networks: [internal]
    profiles: ['phase1']
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
