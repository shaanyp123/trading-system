# sops encryption rules — canonical reference at repo root.
#
# One age recipient per environment. Loss of an env's private key means loss
# of that env's encrypted secrets only — that's the intended blast radius
# (backend-spec §8.1.2). There is no master key. Recovery is paper-in-safe.
#
# Placeholders are substituted on Day 2 15:00 (or any time after operator
# runs `age-keygen`) via:
#
#   bash scripts/sops_init.sh \
#     "$(awk '/^# public key:/ {print $4}' ~/dev-key.txt)" \
#     "$(awk '/^# public key:/ {print $4}' ~/paper-key.txt)" \
#     "$(awk '/^# public key:/ {print $4}' ~/live-key.txt)"
#
# After substitution, each `secrets/<env>.enc.yaml` can be edited with
# `sops secrets/<env>.enc.yaml` and is automatically encrypted on save with
# only that env's recipient.
#
# Operator runbook: deploy/sops/README.md.

creation_rules:
  - path_regex: ^secrets/dev\.enc\.yaml$
    age: <DEV_AGE_PUBKEY_PLACEHOLDER>

  - path_regex: ^secrets/paper\.enc\.yaml$
    age: <PAPER_AGE_PUBKEY_PLACEHOLDER>

  - path_regex: ^secrets/live\.enc\.yaml$
    age: <LIVE_AGE_PUBKEY_PLACEHOLDER>
